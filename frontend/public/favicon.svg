<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#0B1F33"/>
  <!-- Suspension Bridge Cable / Arch -->
  <path d="M6 34C14 20 34 20 42 34" stroke="#D89B24" stroke-width="3" stroke-linecap="round"/>
  <!-- Vertical Suspension Cables -->
  <line x1="16" y1="23" x2="16" y2="34" stroke="#D89B24" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>
  <line x1="24" y1="21" x2="24" y2="34" stroke="#D89B24" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>
  <line x1="32" y1="23" x2="32" y2="34" stroke="#D89B24" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8"/>
  <!-- Road Deck & Dual Lanes -->
  <path d="M4 35H44" stroke="#1976A5" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Perspective Road vanishing toward bridge center -->
  <polygon points="12,42 20,35 28,35 36,42" fill="#123B5D" opacity="0.9"/>
  <line x1="24" y1="36" x2="24" y2="42" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
